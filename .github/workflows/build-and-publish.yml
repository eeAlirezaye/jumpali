deploy:
  needs: build-and-push
  runs-on: ubuntu-latest
  steps:
    - name: Start ssh-agent
      uses: webfactory/ssh-agent@v0.8.1
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

    - name: Deploy core via docker compose override
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        OWNER: ${{ github.repository_owner }}
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
          set -e

          echo \"\$GHCR_TOKEN\" | docker login ghcr.io -u \"\$GHCR_USERNAME\" --password-stdin

          cd /opt/jumpserver-installer-v4.10.15/compose

          cat > core.override.yml <<EOF
          services:
            core:
              image: ghcr.io/${OWNER}/jumpali:latest
              pull_policy: always
          EOF

          docker compose -f core.yml -f core.override.yml pull core
          docker compose -f core.yml -f core.override.yml up -d core

          docker ps --filter name=jms_core --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
        "
